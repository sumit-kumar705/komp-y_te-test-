# Nixpacks configuration for Railway deployment
# This ensures only MySQL dependencies are installed

[phases.setup]
nixPkgs = ["python39", "gcc"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = ["python -m compileall ."]

[start]
cmd = "gunicorn wsgi:app --workers 4 --bind 0.0.0.0:$PORT --timeout 120 --keep-alive 5 --log-level info"
